name: Build APK From Zip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded project ZIP
        run: |
          mkdir -p extracted_project
          ZIP_FILE=$(ls *.zip | head -n 1)
          echo "Extracting $ZIP_FILE..."
          unzip -q "$ZIP_FILE" -d extracted_project
          if [ -d "extracted_project/CreamLunarWeather" ] && [ ! -f "extracted_project/settings.gradle.kts" ]; then
            mv extracted_project/CreamLunarWeather/* extracted_project/
          fi
          ls -la extracted_project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: extracted_project/**/*.gradle*

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        working-directory: extracted_project
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: extracted_project/app/build/outputs/apk/debug/app-debug.apk
